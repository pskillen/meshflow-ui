name: ghcr-cleanup

on:
  schedule:
    - cron: '47 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-cleanup-meshtastic-bot-ui
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete untagged images
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          package_name: meshtastic-bot-ui
          owner_type: user
          untagged_only: true
